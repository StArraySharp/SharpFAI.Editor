<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SharpFAI</title>
  <style>
    :root { color-scheme: dark; font: 13px system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; height: 100dvh; overflow: hidden;
      display: grid; grid-template-rows: auto minmax(0, 1fr);
      background: #0b0c0e; color: #ebedf0;
    }
    #toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
      padding: 4px 8px; border-bottom: 1px solid #35383e; background: #1b1d20;
    }
    #status { display: inline-flex; align-items: center; gap: 6px; color: #bdc3cc; }
    #status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #9198a3; }
    #status[data-state="connecting"]::before { background: #e9b95e; }
    #status[data-state="connected"]::before { background: #6cd4a1; }
    #status[data-state="error"]::before, #status[data-state="invalid"]::before { background: #f48b8b; }
    .actions { display: flex; gap: 4px; margin-inline-start: auto; }
    button {
      display: grid; place-items: center; width: 28px; height: 28px; padding: 0;
      border: 1px solid #41454c; border-radius: 4px; background: #272a2f;
      color: inherit; cursor: pointer;
    }
    button[hidden] { display: none; }
    button:hover, button[aria-pressed="true"] { background: #3b4048; }
    button:focus-visible { outline: 2px solid #8ad3ff; outline-offset: 1px; }
    button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    #viewport {
      position: relative; min-width: 0; min-height: 0; container-type: size;
      display: grid; place-items: center; overflow: hidden;
    }
    #mirror-canvas {
      display: block; width: min(100cqw, calc(100cqh * var(--ratio, 1.77777778)));
      height: auto; background: #101113; touch-action: none; user-select: none;
    }
    #viewport:focus-within #mirror-canvas { outline: 1px solid #8ad3ff; outline-offset: -1px; }
    #mirror-input {
      position: absolute; left: 50%; top: 50%; width: 1rem; height: 1.5rem;
      margin: 0; padding: 0; border: 0; opacity: 0; pointer-events: none;
      resize: none; font-size: 16px;
    }
  </style>
</head>
<body>
  <header id="toolbar">
    <strong>SharpFAI</strong>
    <span id="status" role="status" data-state="disconnected">Disconnected</span>
    <div class="actions">
      <button id="reconnect" type="button" title="Reconnect" aria-label="Reconnect">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2 6m2-12v6h-6"/></svg>
      </button>
      <button id="fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
      </button>
    </div>
  </header>
  <main id="viewport">
    <canvas id="mirror-canvas" width="16" height="9" data-ready="false"></canvas>
    <textarea id="mirror-input" rows="1" aria-label="SharpFAI mirror input"
      autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  </main>
  <script>
    (() => {
      "use strict";
      const zh = /^zh\b/i.test(navigator.language);
      const labels = zh ? {
        disconnected: "\u672a\u8fde\u63a5", connecting: "\u6b63\u5728\u8fde\u63a5", connected: "\u5df2\u8fde\u63a5",
        error: "\u8fde\u63a5\u5931\u8d25", invalid: "\u94fe\u63a5\u65e0\u6548", reconnect: "\u91cd\u8fde",
        fullscreen: "\u5168\u5c4f", exitFullscreen: "\u9000\u51fa\u5168\u5c4f", input: "SharpFAI \u955c\u50cf\u8f93\u5165"
      } : {
        disconnected: "Disconnected", connecting: "Connecting", connected: "Connected",
        error: "Connection failed", invalid: "Invalid link", reconnect: "Reconnect",
        fullscreen: "Fullscreen", exitFullscreen: "Exit fullscreen", input: "SharpFAI mirror input"
      };
      if (zh) document.documentElement.lang = "zh";
      const status = document.getElementById("status");
      const reconnect = document.getElementById("reconnect");
      const fullscreen = document.getElementById("fullscreen");
      const viewport = document.getElementById("viewport");
      const canvas = document.getElementById("mirror-canvas");
      const input = document.getElementById("mirror-input");
      const context = canvas.getContext("2d", { alpha: false });
      const buttonMasks = [1, 4, 2]; // DOM button order differs from the buttons bitmask.
      const keys = new Set();
      let connection = null;
      let closing = null;
      let connectAttempt = 0;
      let pointer = null;
      let buttons = 0;
      let pendingMove = null;
      let moveFrame = null;
      let composing = false;
      let recentCommit = null;

      function setStatus(state) {
        status.dataset.state = state;
        status.textContent = labels[state];
      }

      function labelButton(button, label) {
        button.title = label;
        button.setAttribute("aria-label", label);
      }

      function isOpen() {
        return connection?.socket.readyState === WebSocket.OPEN;
      }

      function send(message) {
        if (isOpen()) connection.socket.send(JSON.stringify(message));
      }

      function flushMove(write = true) {
        if (moveFrame !== null) cancelAnimationFrame(moveFrame);
        moveFrame = null;
        const move = pendingMove;
        pendingMove = null;
        if (write && move) send(move);
      }

      function discrete(message) {
        flushMove();
        send(message);
      }

      function releasePointer() {
        const id = pointer;
        pointer = null;
        buttons = 0;
        if (id !== null && canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
      }

      function resetInput(notify = true) {
        flushMove(notify);
        if (notify) send({ type: "reset" });
        releasePointer();
        keys.clear();
        composing = false;
        recentCommit = null;
        input.value = "";
      }

      function clearFrame() {
        canvas.dataset.ready = "false";
        context.clearRect(0, 0, canvas.width, canvas.height);
      }

      function disconnect() {
        const previous = connection;
        resetInput();
        connection = null;
        input.blur();
        if (previous) {
          previous.pending = null;
          if (previous.socket.readyState !== WebSocket.CLOSED) {
            closing = new Promise(resolve => {
              previous.socket.addEventListener("close", resolve, { once: true });
            }).finally(() => { closing = null; });
            previous.socket.close();
          }
        }
        clearFrame();
      }

      async function decodeFrames(current) {
        current.decoding = true;
        try {
          while (connection === current && current.pending) {
            const frame = current.pending;
            current.pending = null;
            let bitmap;
            try {
              bitmap = await createImageBitmap(new Blob([frame], { type: "image/jpeg" }));
              if (connection !== current || !isOpen()) return;
              if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
                canvas.width = bitmap.width;
                canvas.height = bitmap.height;
                canvas.style.setProperty("--ratio", bitmap.width / bitmap.height);
              }
              context.drawImage(bitmap, 0, 0);
              canvas.dataset.ready = "true";
            } catch {
              // A bad frame does not interrupt the stream.
            } finally {
              bitmap?.close();
            }
          }
        } finally {
          current.decoding = false;
        }
      }

      async function connect() {
        const attempt = ++connectAttempt;
        disconnect();
        const token = location.hash.slice(1);
        if (location.protocol !== "http:" || location.hostname !== "127.0.0.1" ||
            token.length !== 48 || !/^[0-9a-f]+$/i.test(token)) {
          setStatus("invalid");
          return;
        }
        setStatus("connecting");
        // The server only accepts one client at a time.
        if (closing) await closing;
        if (attempt !== connectAttempt) return;
        let socket;
        try {
          socket = new WebSocket(`ws://${location.host}/mirror`, `sharpfai.${token}`);
        } catch {
          setStatus("error");
          return;
        }
        const current = { socket, pending: null, decoding: false, failed: false };
        connection = current;
        socket.binaryType = "arraybuffer";
        socket.addEventListener("open", () => {
          if (connection === current) setStatus("connected");
        });
        socket.addEventListener("message", event => {
          if (connection !== current || !(event.data instanceof ArrayBuffer)) return;
          current.pending = event.data;
          if (!current.decoding) void decodeFrames(current);
        });
        socket.addEventListener("error", () => {
          if (connection !== current) return;
          current.failed = true;
          setStatus("error");
        });
        socket.addEventListener("close", () => {
          if (connection !== current) return;
          connection = null;
          current.pending = null;
          resetInput(false);
          input.blur();
          clearFrame();
          setStatus(current.failed ? "error" : "disconnected");
        });
      }

      function points(event) {
        if (!isOpen() || document.hidden || canvas.dataset.ready !== "true") return null;
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;
        const clamp = n => Math.min(1, Math.max(0, n));
        return {
          x: clamp((event.clientX - rect.left) / rect.width),
          y: clamp((event.clientY - rect.top) / rect.height)
        };
      }

      function updateButtons(next, position) {
        const changed = buttons ^ next;
        if (!changed) return false;
        for (const [button, mask] of buttonMasks.entries()) {
          if (changed & mask) discrete({ type: "button", ...position, button, down: !!(next & mask) });
        }
        buttons = next;
        return true;
      }

      canvas.addEventListener("pointerdown", event => {
        const position = points(event);
        if (!position || pointer !== null || !(event.buttons & 7)) return;
        event.preventDefault();
        const bounds = viewport.getBoundingClientRect();
        input.style.left = `${Math.max(0, Math.min(bounds.width - input.offsetWidth, event.clientX - bounds.left))}px`;
        input.style.top = `${Math.max(0, Math.min(bounds.height - input.offsetHeight, event.clientY - bounds.top))}px`;
        input.focus({ preventScroll: true });
        pointer = event.pointerId;
        canvas.setPointerCapture(pointer);
        updateButtons(event.buttons & 7, position);
      });
      canvas.addEventListener("pointermove", event => {
        const position = points(event);
        if (!position || (pointer === null ? event.pointerType === "touch" || event.buttons : event.pointerId !== pointer)) return;
        // Chorded mouse buttons change via pointermove rather than pointerdown/up.
        if (pointer !== null && updateButtons(event.buttons & 7, position)) return;
        pendingMove = { type: "move", ...position };
        if (moveFrame === null) moveFrame = requestAnimationFrame(() => flushMove());
      });
      canvas.addEventListener("pointerup", event => {
        if (event.pointerId !== pointer) return;
        const position = points(event);
        if (position) {
          updateButtons(0, position);
          releasePointer();
        } else {
          resetInput();
        }
      });
      for (const type of ["pointercancel", "lostpointercapture"]) {
        canvas.addEventListener(type, event => {
          if (event.pointerId === pointer) resetInput();
        });
      }
      viewport.addEventListener("contextmenu", event => event.preventDefault());
      canvas.addEventListener("auxclick", event => event.preventDefault());
      canvas.addEventListener("wheel", event => {
        const position = points(event);
        if (!position) return;
        event.preventDefault();
        const mode = event.deltaMode;
        const scale = mode === 1 ? 3 : mode === 2 ? 1 : 100;
        const notches = delta => Math.max(-20, Math.min(20, -delta / scale));
        discrete({ type: "wheel", ...position, dx: notches(event.deltaX), dy: notches(event.deltaY),
          ctrl: event.ctrlKey, shift: event.shiftKey });
      }, { passive: false });

      function hasInputFocus() {
        return document.activeElement === input && document.hasFocus() && !document.hidden;
      }

      function sendText(text) {
        text = text.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]|[\uD800-\uDFFF]/g, match => match.length === 2 ? match : "\uFFFD");
        for (let start = 0; start < text.length;) {
          let end = Math.min(start + 512, text.length);
          if (end < text.length && /[\uD800-\uDBFF]/.test(text[end - 1]) && /[\uDC00-\uDFFF]/.test(text[end])) end--;
          discrete({ type: "text", text: text.slice(start, end) });
          start = end;
        }
      }

      input.addEventListener("keydown", event => {
        if (!hasInputFocus() || !isOpen()) return;
        recentCommit = null;
        if (event.code && event.code.length <= 32 && event.code !== "Unidentified" &&
            !event.repeat && !keys.has(event.code)) {
          keys.add(event.code);
          discrete({ type: "key", code: event.code, down: true, ctrl: event.ctrlKey, shift: event.shiftKey });
        }
        const paste = ((event.ctrlKey || event.metaKey) && event.code === "KeyV") ||
          (event.shiftKey && event.code === "Insert");
        const printable = [...event.key].length === 1 && !event.metaKey &&
          ((!event.ctrlKey && !event.altKey) || event.getModifierState("AltGraph"));
        if (!paste && !printable && !composing && !event.isComposing &&
            !["Dead", "Process", "Unidentified"].includes(event.key)) event.preventDefault();
      });
      input.addEventListener("keyup", event => {
        if (!hasInputFocus()) return;
        if (keys.delete(event.code) || /^(Control|Shift)(Left|Right)$/.test(event.code))
          discrete({ type: "key", code: event.code, down: false, ctrl: event.ctrlKey, shift: event.shiftKey });
      });
      input.addEventListener("input", event => {
        if (composing || event.isComposing) return;
        const text = event.data ?? input.value;
        input.value = "";
        if (event.inputType === "insertCompositionText" || event.inputType === "insertFromComposition" ||
            event.inputType === "insertLineBreak" || event.inputType === "insertParagraph") return;
        const duplicate = recentCommit !== null && recentCommit === text;
        recentCommit = null;
        if (!duplicate && hasInputFocus()) sendText(text);
      });
      input.addEventListener("compositionstart", () => {
        composing = hasInputFocus() && isOpen();
        recentCommit = null;
      });
      input.addEventListener("compositionend", event => {
        const committed = composing;
        composing = false;
        input.value = "";
        if (!committed || !hasInputFocus() || !event.data) return;
        sendText(event.data);
        // Some browsers also report the commit as a subsequent insertText event.
        recentCommit = event.data;
        setTimeout(() => { recentCommit = null; }, 0);
      });
      input.addEventListener("paste", event => {
        if (!hasInputFocus() || !isOpen() || !event.clipboardData) return;
        event.preventDefault();
        sendText(event.clipboardData.getData("text/plain"));
      });
      input.addEventListener("blur", () => resetInput());
      function suspendInput() {
        if (document.activeElement === input) input.blur();
        else resetInput();
      }
      window.addEventListener("blur", suspendInput);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) suspendInput();
      });
      window.addEventListener("pagehide", () => {
        ++connectAttempt;
        disconnect();
      });
      window.addEventListener("pageshow", event => { if (event.persisted) connect(); });
      window.addEventListener("hashchange", connect);

      input.setAttribute("aria-label", labels.input);
      labelButton(reconnect, labels.reconnect);
      reconnect.addEventListener("click", connect);
      if (document.fullscreenEnabled) {
        fullscreen.hidden = false;
        labelButton(fullscreen, labels.fullscreen);
        fullscreen.addEventListener("click", async () => {
          try {
            if (document.fullscreenElement) await document.exitFullscreen();
            else await document.documentElement.requestFullscreen();
          } catch { /* Fullscreen may be denied by the browser. */ }
        });
        document.addEventListener("fullscreenchange", () => {
          const active = !!document.fullscreenElement;
          fullscreen.setAttribute("aria-pressed", String(active));
          labelButton(fullscreen, active ? labels.exitFullscreen : labels.fullscreen);
        });
      }
      connect();
    })();
  </script>
</body>
</html>
